<html>
    <head>
        <link rel="stylesheet" href="./main.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1 id="title"><mark>Velvet</mark> Clock</h1>
        <button id="settingsButton"></button>
        <button id="themesButton"></button>
        <div id="time">
            <p id="hour">14</p>
            <p id="colon1">:</p>
            <p id="minute">02</p>
            <p id="colon2">:</p>
            <p id="second">39</p>
            <p id="meridiem">PM</p>
        </div>
        <div id="modeSelect">
            <button id="clockButton"class="selected">CLOCK</button>
            <button id="timerButton">TIMER</button>
        </div>
        <div id="settings">
            <button id="militaryToggleButton">Military Time</button>
            <button id="secondsToggleButton">Show Seconds</button>
            <button id="animationToggleButton">Clock Animations</button>
            <br>
            <button id="settingsCloseButton">Close</button>
        </div>
        <div id="timerDiv">
            <div id="timerDivTimeSelect">
                <input  placeholder="00"id="timerTimeHour"type="number"min="0"max="24">
                <p>:</p>
                <input placeholder="00"id="timerTimeMinute"type="number"min="0"max="60">
                <p>:</p>
                <input placeholder="00"id="timerTimeSeconds"type="number"min="0"max="60">
                <p id="timerTimeHint">Hours Minutes Seconds</p>
                <button id="timerTimeBut">Ok</button>
            </div>
            <p>or</p>
            <div id="timerDivClockSelect">
            </div>
        </div>
    </body>
</html>
<script src="./main.js"></script>
