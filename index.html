<html>
    <head>
        <link id="defStylesheet" rel="stylesheet" href="basic.css">
        <link id="themeStylesheet" rel="stylesheet" href="basic.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <h1 id="title"><mark>Velvet</mark> Clock</h1>
        <button id="settingsButton"></button>
        <button id="themesButton"></button>
        <div id="time">
            <p id="hour">14</p>
            <p id="colon1">:</p>
            <p id="minute">02</p>
            <p id="colon2">:</p>
            <p id="second">39</p>
            <p id="meridiem">PM</p>
        </div>
        <div id="modeSelect">
            <button id="clockButton"class="selected">CLOCK</button>
            <button id="timerButton">TIMER</button>
        </div>
        <div id="settings">
            <button id="militaryToggleButton">Military Time</button>
            <button id="secondsToggleButton">Show Seconds</button>
            <button id="animationToggleButton">Clock Animations</button>
            <br>
            <button id="settingsCloseButton">Close</button>
        </div>
        <div id="timerDiv">
            <div id="timerDivTimeSelect">
                <h1>Go off in amount of time</h1>
                <input  placeholder="00"id="timerTimeHour"type="number"min="0"max="24"oninput="this.value=this.value.slice(0,2);if (parseInt(this.value) > 24){this.value = '24'}">
                <p>:</p>
                <input placeholder="00"id="timerTimeMinute"type="number"min="0"max="60"oninput="this.value=this.value.slice(0,2);if (parseInt(this.value) > 60){this.value = '60'}">
                <p>:</p>
                <input placeholder="00"id="timerTimeSeconds"type="number"min="0"max="60"oninput="this.value=this.value.slice(0,2);if (parseInt(this.value) > 60){this.value = '60'}">
                <p id="timerTimeHint">Hours Minutes Seconds</p>
                <button id="timerTimeBut">Ok</button>
            </div>
            <div id="timerDivClockSelect">
                <h1>Go off at a specific time</h1>
                <input  placeholder="00"id="timerClockHour"type="number"min="0"max="24"oninput="
                this.value=this.value.slice(0,2);
                if (parseInt(this.value) > 12){
                    document.getElementById('timerClockMeridiem').style.display = 'none';
                    document.getElementById('timerDivClockSelect').getElementsByTagName('p')[1].style.display = 'none';
                    document.getElementById('timerClockHint').textContent = 'Hour Minute'
                }
                else{
                    getElementById('timerClockMeridiem').style.display = '';
                    document.getElementById('timerDivClockSelect').getElementsByTagName('p')[1].style.display = '';
                    document.getElementById('timerClockHint').textContent = 'Hour Minute Meridiem'
                }">
                <p>:</p>
                <input placeholder="00"id="timerClockMinute"type="number"min="0"max="60"oninput="this.value=this.value.slice(0,2);if (parseInt(this.value) > 59){this.value = '59'}">
                <p>:</p>
                <button id="timerClockMeridiem">AM</button>
                <p id="timerClockHint">Hour Minute Meridiem</p>
                <button id="timerClockBut">Ok</button>
            </div>
        </div>
        <div id="timerUpDiv">
            <div>
                <h1>TIMES UP!</h1>
                <button>Ok</button>
            </div>
        </div>
        <div id="stylesDiv">
            <div id="stylesDivInner">
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','basic.css')" style="color: black; background-color: white; border: .5vw black solid; box-shadow: 0vw .5vw black;">Basic</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','night.css')" style="color: rgb(255, 255, 255); background-color: rgb(0, 0, 0); border: .5vw rgb(255, 255, 255) solid; box-shadow: 0vw .5vw rgb(255, 255, 255);">Night</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','paper.css')" style="color: #3e2c12; background-color: rgb(255, 247, 237); border: .5vw #3e2c12 solid; box-shadow: 0vw .5vw #3e2c12;">Paper</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','thief.css')" style="color: #ff0000; background-color: rgb(0, 0, 0); border: .5vw #ff0000 solid; box-shadow: 0vw .5vw #ff0000;">Thief</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','truth.css')" style="color: #463a0b; background-color: rgb(255, 213, 0); border: .5vw #463a0b solid; box-shadow: 0vw .5vw #463a0b;">Truth</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','moon.css')" style="color: #b9d7ff; background-color: rgb(47, 60, 163); border: .5vw #b9d7ff solid; box-shadow: 0vw .5vw #b9d7ff;">Moon</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','viv.css')" style="color: #ffffff; background-color: rgb(243, 183, 205); border: .5vw #ffffff solid; box-shadow: 0vw .5vw #ffffff;">Viv</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','rex.css')" style="color: #044b00; background-color: rgb(243, 235, 85); border: .5vw #044b00 solid; box-shadow: 0vw .5vw #044b00;">Rex</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','lil.css')" style="color: #fad180; background-color: rgb(57, 26, 61); border: .5vw #fad180 solid; box-shadow: 0vw .5vw #fad180;">Lil</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','mag.css')" style="color: #d8e3e7; background-color: rgb(91, 95, 123); border: .5vw #d8e3e7 solid; box-shadow: 0vw .5vw #d8e3e7;">Mag</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','sil.css')" style="color: #cebfbf; background-color: rgb(166, 150, 125); border: .5vw #cebfbf solid; box-shadow: 0vw .5vw #cebfbf;">Sil</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','eli.css')" style="color: #86612d; background-color: rgb(33, 46, 10); border: .5vw #86612d solid; box-shadow: 0vw .5vw #86612d;">Eli</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','nuke.css')" style="color: #53277c; background-color: rgb(255, 211, 37); border: .5vw #53277c solid; box-shadow: 0vw .5vw #53277c;">Nuke</button>
                <button onclick="document.getElementById('themeStylesheet').setAttribute('href','v.css')" style="color: #7a5529fe; background-color: rgb(57, 11, 11); border: .5vw #7a5529fe solid; box-shadow: 0vw .5vw #7a5529fe;">Basic</button>
            </div>
            <button id="stylesDivCloseButton">Exit</button>
        </div>
    </body>
</html>
<script src="./main.js"></script>
